  - main [ref=f6e109]:
    - generic [ref=f6e112]:
      - generic [ref=f6e113]: 01 — Capability
      - heading "Everything You Need" [level=2] [ref=f6e114]
    - paragraph [ref=f6e115]: From multi-location management to AI-powered optimization, Wiz Scheduler handles the complexity so you don't have to.
    - generic [ref=f6e116]:
      - generic [ref=f6e117]:
        - heading "AI Schedule Generation" [level=3] [ref=f6e118]
        - paragraph [ref=f6e119]: Claude AI analyzes availability, skills, and team dynamics to create optimal schedules in seconds. Optional — the free algorithmic strategies build a complete schedule without it.
      - generic [ref=f6e120]:
        - heading "Multiple Strategies" [level=3] [ref=f6e121]
        - paragraph [ref=f6e122]: Rotation, 3-month history fairness, max-hours caps, or pure random. Pick what works for each location.
      - generic [ref=f6e123]:
        - heading "Multi-Location" [level=3] [ref=f6e124]
        - paragraph [ref=f6e125]: Manage regions, locations, and ownership groups. Each location gets its own shift templates and schedules.
    - generic [ref=f6e126]:
      - generic [ref=f6e127]:
        - term [ref=f6e128]: Per-Employee Hour Caps
        - definition [ref=f6e129]: Set a maximum weekly hours limit for each employee. The scheduler enforces the cap across all locations in a single run — no manual tracking needed.
      - generic [ref=f6e130]:
        - term [ref=f6e131]: Day Blackout Rules
        - definition [ref=f6e132]: Block out recurring time ranges per day of week when an employee must not be scheduled. For example, "no Mondays 8 PM–10 PM" — enforced automatically every week.
      - generic [ref=f6e133]:
        - term [ref=f6e134]: Employee Self-Service
        - definition [ref=f6e135]: Employees set their own availability via invite links. Managers see it all in one place.
      - generic [ref=f6e136]:
        - term [ref=f6e137]: 7shifts Integration
        - definition [ref=f6e138]: Import employees, roles, and availability from 7shifts. Export approved schedules back with one click.
      - generic [ref=f6e139]:
        - term [ref=f6e140]: Deputy Integration
        - definition [ref=f6e141]: Import locations, areas, employees, and unavailability from Deputy. Unavailability is automatically inverted into availability windows for scheduling.
      - generic [ref=f6e142]:
        - term [ref=f6e143]: GDPR Compliant
        - definition [ref=f6e144]: Data export, account deletion, consent tracking, log redaction, and automatic data retention policies.
      - generic [ref=f6e145]:
        - term [ref=f6e146]: Team Affinities
        - definition [ref=f6e147]: Set preferences for who should (or shouldn't) work together. Hard and soft constraints supported.
      - generic [ref=f6e148]:
        - term [ref=f6e149]: Role Equivalents
        - definition [ref=f6e150]: Group similar roles so employees can fill shifts across equivalent positions automatically.
      - generic [ref=f6e151]:
        - term [ref=f6e152]: 19 Languages
        - definition [ref=f6e153]: Full UI localization in English, Chinese, Hindi, Spanish, French, Arabic, Japanese, and 12 more.
    - generic [ref=f6e155]:
      - paragraph [ref=f6e156]: 02 — Proof
      - heading "See It in Action" [level=2] [ref=f6e157]
      - paragraph [ref=f6e158]: Watch a quick walkthrough of how Wiz Scheduler helps you build optimized schedules in minutes.
      - iframe [ref=f6e160]
      - link "Explore every manager screen →" [ref=f6e162] [cursor=pointer]:
        - /url: /features
    - generic [ref=f6e165]:
      - generic [ref=f6e166]: 03 — Method
      - heading "Scheduling Strategies" [level=2] [ref=f6e167]
    - paragraph [ref=f6e168]: Choose the approach that fits your business. Mix and match across locations. AI is one optional strategy among four — none of them require it.
    - generic [ref=f6e169]:
      - paragraph [ref=f6e170]: OPTIONAL · PREPAID CREDITS
      - heading "AI Generate" [level=3] [ref=f6e171]
      - paragraph [ref=f6e172]: Claude AI reads the full context (availability, skills, affinities, shift requirements) and produces an optimized schedule. Honors all affinity constraints. Best for complex scenarios. It's an optional path — the three free strategies below produce a full schedule without touching AI or credits.
    - generic [ref=f6e173]:
      - generic [ref=f6e174]:
        - paragraph [ref=f6e175]: FREE
        - heading "Rotation" [level=3] [ref=f6e176]
        - paragraph [ref=f6e177]: "Evenly distributes shifts across employees within the current schedule. Penalizes repeat assignments to the same role. Respects employee affinities: hard constraints are enforced, soft preferences influence scoring."
      - generic [ref=f6e178]:
        - paragraph [ref=f6e179]: FREE
        - heading "Rotation (3-Month History)" [level=3] [ref=f6e180]
        - paragraph [ref=f6e181]: "Considers total hours worked per role over the past 3 months. Adjustable fairness weight from random (0) to strictly fair (1). Respects employee affinities: hard constraints are enforced, soft preferences influence scoring."
      - generic [ref=f6e182]:
        - paragraph [ref=f6e183]: FREE
        - heading "Max Hours Per Employee" [level=3] [ref=f6e184]
        - paragraph [ref=f6e185]: "Caps any single employee at X hours per schedule. Adjustable hour limit (4-60h) and strictness (soft preference to hard cap). Respects employee affinities: hard constraints are enforced, soft preferences influence scoring."
    - generic [ref=f6e188]:
      - generic [ref=f6e189]: 04 — Inputs
      - heading "What the Scheduler Considers" [level=2] [ref=f6e190]
    - paragraph [ref=f6e191]: Every draft, from every strategy, is checked against the same rules. They carry the same names here as on the Scheduling Rules page in the app.
    - generic [ref=f6e192]:
      - generic [ref=f6e193]:
        - paragraph [ref=f6e194]: Always enforced
        - generic [ref=f6e195]:
          - generic [ref=f6e196]:
            - term [ref=f6e197]: Employee availability
            - definition [ref=f6e198]: Shifts land only inside the windows each employee has given. No availability on file means never scheduled. Hours already booked at another location in the same run are held.
          - generic [ref=f6e199]:
            - term [ref=f6e200]: Roles and skill levels
            - definition [ref=f6e201]: An employee must hold the shift's role, or an equivalent one. Higher skill levels are favored when several people qualify.
          - generic [ref=f6e202]:
            - term [ref=f6e203]: Hour Restrictions
            - definition [ref=f6e204]: A weekly hour cap per employee, held across every location in the same run.
          - generic [ref=f6e205]:
            - term [ref=f6e206]: Day Rules
            - definition [ref=f6e207]: Recurring blackout ranges per day of the week. The scheduler never places a shift across one.
          - generic [ref=f6e208]:
            - term [ref=f6e209]: Minimum rest
            - definition [ref=f6e210]: A per-location gap between shifts on different days, so nobody closes and then opens.
          - generic [ref=f6e211]:
            - term [ref=f6e212]: Employee Association
            - definition [ref=f6e213]: Cannot-work-together pairs are never put on the same shift. Must-work-together, nice-to-have and prefer-apart pairs steer who gets picked.
      - generic [ref=f6e214]:
        - paragraph [ref=f6e215]: Weighted 0 to 1. At 1.0 a preference becomes a rule.
        - generic [ref=f6e216]:
          - generic [ref=f6e217]:
            - term [ref=f6e218]: Day Preferences
            - definition [ref=f6e219]: Which days of the week each employee prefers.
          - generic [ref=f6e220]:
            - term [ref=f6e221]: Hour Range Preferences
            - definition [ref=f6e222]: Which times of day each employee prefers. A shift counts when at least half of it falls in the range.
          - generic [ref=f6e223]:
            - term [ref=f6e224]: Frequency Caps
            - definition [ref=f6e225]: How many times a week an employee works inside a given hour range.
    - paragraph [ref=f6e226]: Shift templates and specific-date overrides define what needs filling. Every draft is re-validated after generation, and any shift that went against a soft preference is flagged for review.
    - paragraph [ref=f6e227]: "Not yet considered: pay rates, overtime premiums, seniority. Minimum rest is the only labor-law rule built in."
    - generic [ref=f6e230]:
      - generic [ref=f6e231]: 05 — Cost
      - heading "Simple, Transparent Pricing" [level=2] [ref=f6e232]
    - paragraph [ref=f6e233]: No hidden fees. Pricing philosophy is to charge $18 a month and charge only more to cover associated costs.
