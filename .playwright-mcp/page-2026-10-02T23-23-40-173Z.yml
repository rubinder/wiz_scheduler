  - main [ref=e109]:
    - generic [ref=e112]:
      - generic [ref=e113]: 01 — Capability
      - heading "Everything You Need" [level=2] [ref=e114]
    - paragraph [ref=e115]: From multi-location management to AI-powered optimization, Wiz Scheduler handles the complexity so you don't have to.
    - generic [ref=e116]:
      - generic [ref=e117]:
        - heading "AI Schedule Generation" [level=3] [ref=e118]
        - paragraph [ref=e119]: Claude AI analyzes availability, skills, and team dynamics to create optimal schedules in seconds. Optional — the free algorithmic strategies build a complete schedule without it.
      - generic [ref=e120]:
        - heading "Multiple Strategies" [level=3] [ref=e121]
        - paragraph [ref=e122]: Rotation, 3-month history fairness, max-hours caps, or pure random. Pick what works for each location.
      - generic [ref=e123]:
        - heading "Multi-Location" [level=3] [ref=e124]
        - paragraph [ref=e125]: Manage regions, locations, and ownership groups. Each location gets its own shift templates and schedules.
    - generic [ref=e126]:
      - generic [ref=e127]:
        - term [ref=e128]: Per-Employee Hour Caps
        - definition [ref=e129]: Set a maximum weekly hours limit for each employee. The scheduler enforces the cap across all locations in a single run — no manual tracking needed.
      - generic [ref=e130]:
        - term [ref=e131]: Day Blackout Rules
        - definition [ref=e132]: Block out recurring time ranges per day of week when an employee must not be scheduled. For example, "no Mondays 8 PM–10 PM" — enforced automatically every week.
      - generic [ref=e133]:
        - term [ref=e134]: Employee Self-Service
        - definition [ref=e135]: Employees set their own availability via invite links. Managers see it all in one place.
      - generic [ref=e136]:
        - term [ref=e137]: 7shifts Integration
        - definition [ref=e138]: Import employees, roles, and availability from 7shifts. Export approved schedules back with one click.
      - generic [ref=e139]:
        - term [ref=e140]: Deputy Integration
        - definition [ref=e141]: Import locations, areas, employees, and unavailability from Deputy. Unavailability is automatically inverted into availability windows for scheduling.
      - generic [ref=e142]:
        - term [ref=e143]: GDPR Compliant
        - definition [ref=e144]: Data export, account deletion, consent tracking, log redaction, and automatic data retention policies.
      - generic [ref=e145]:
        - term [ref=e146]: Team Affinities
        - definition [ref=e147]: Set preferences for who should (or shouldn't) work together. Hard and soft constraints supported.
      - generic [ref=e148]:
        - term [ref=e149]: Role Equivalents
        - definition [ref=e150]: Group similar roles so employees can fill shifts across equivalent positions automatically.
      - generic [ref=e151]:
        - term [ref=e152]: 19 Languages
        - definition [ref=e153]: Full UI localization in English, Chinese, Hindi, Spanish, French, Arabic, Japanese, and 12 more.
