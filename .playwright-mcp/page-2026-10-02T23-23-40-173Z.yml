    - generic [ref=e165]:
      - generic [ref=e166]: 03 — Method
      - heading "Scheduling Strategies" [level=2] [ref=e167]
    - paragraph [ref=e168]: Choose the approach that fits your business. Mix and match across locations. AI is one optional strategy among four — none of them require it.
    - generic [ref=e169]:
      - paragraph [ref=e170]: OPTIONAL · PREPAID CREDITS
      - heading "AI Generate" [level=3] [ref=e171]
      - paragraph [ref=e172]: Claude AI reads the full context (availability, skills, affinities, shift requirements) and produces an optimized schedule. Honors all affinity constraints. Best for complex scenarios. It's an optional path — the three free strategies below produce a full schedule without touching AI or credits.
    - generic [ref=e173]:
      - generic [ref=e174]:
        - paragraph [ref=e175]: FREE
        - heading "Rotation" [level=3] [ref=e176]
        - paragraph [ref=e177]: "Evenly distributes shifts across employees within the current schedule. Penalizes repeat assignments to the same role. Respects employee affinities: hard constraints are enforced, soft preferences influence scoring."
      - generic [ref=e178]:
        - paragraph [ref=e179]: FREE
        - heading "Rotation (3-Month History)" [level=3] [ref=e180]
        - paragraph [ref=e181]: "Considers total hours worked per role over the past 3 months. Adjustable fairness weight from random (0) to strictly fair (1). Respects employee affinities: hard constraints are enforced, soft preferences influence scoring."
      - generic [ref=e182]:
        - paragraph [ref=e183]: FREE
        - heading "Max Hours Per Employee" [level=3] [ref=e184]
        - paragraph [ref=e185]: "Caps any single employee at X hours per schedule. Adjustable hour limit (4-60h) and strictness (soft preference to hard cap). Respects employee affinities: hard constraints are enforced, soft preferences influence scoring."
    - generic [ref=e188]:
      - generic [ref=e189]: 04 — Inputs
      - heading "What the Scheduler Considers" [level=2] [ref=e190]
    - paragraph [ref=e191]: Every draft, from every strategy, is checked against the same rules. They carry the same names here as on the Scheduling Rules page in the app.
    - generic [ref=e192]:
      - generic [ref=e193]:
        - paragraph [ref=e194]: Always enforced
        - generic [ref=e195]:
          - generic [ref=e196]:
            - term [ref=e197]: Employee availability
            - definition [ref=e198]: Shifts land only inside the windows each employee has given. No availability on file means never scheduled. Hours already booked at another location in the same run are held.
          - generic [ref=e199]:
            - term [ref=e200]: Roles and skill levels
            - definition [ref=e201]: An employee must hold the shift's role, or an equivalent one. Higher skill levels are favored when several people qualify.
          - generic [ref=e202]:
            - term [ref=e203]: Hour Restrictions
            - definition [ref=e204]: A weekly hour cap per employee, held across every location in the same run.
          - generic [ref=e205]:
            - term [ref=e206]: Day Rules
            - definition [ref=e207]: Recurring blackout ranges per day of the week. The scheduler never places a shift across one.
          - generic [ref=e208]:
            - term [ref=e209]: Minimum rest
            - definition [ref=e210]: A per-location gap between shifts on different days, so nobody closes and then opens.
          - generic [ref=e211]:
            - term [ref=e212]: Employee Association
            - definition [ref=e213]: Cannot-work-together pairs are never put on the same shift. Must-work-together, nice-to-have and prefer-apart pairs steer who gets picked.
      - generic [ref=e214]:
        - paragraph [ref=e215]: Weighted 0 to 1. At 1.0 a preference becomes a rule.
        - generic [ref=e216]:
          - generic [ref=e217]:
            - term [ref=e218]: Day Preferences
            - definition [ref=e219]: Which days of the week each employee prefers.
          - generic [ref=e220]:
            - term [ref=e221]: Hour Range Preferences
            - definition [ref=e222]: Which times of day each employee prefers. A shift counts when at least half of it falls in the range.
          - generic [ref=e223]:
            - term [ref=e224]: Frequency Caps
            - definition [ref=e225]: How many times a week an employee works inside a given hour range.
    - paragraph [ref=e226]: Shift templates and specific-date overrides define what needs filling. Every draft is re-validated after generation, and any shift that went against a soft preference is flagged for review.
    - paragraph [ref=e227]: "Not yet considered: pay rates, overtime premiums, seniority. Minimum rest is the only labor-law rule built in."
    - generic [ref=e230]:
